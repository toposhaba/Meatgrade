<template>
  <lightning-card title="Meatgrade" icon-name="standard:product">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <p class="slds-m-bottom_small">
        Confirm the marbling degree. Beef quality follows the carcass beef standard for each whole
        maturity group. A USDA grader still assigns the official grade.
      </p>
      <div class="slds-m-bottom_small">
        <lightning-button label="Beef" data-species="Beef" onclick={handleSpecies} variant={beefVariant}></lightning-button>
        <lightning-button label="Pork" data-species="Pork" onclick={handleSpecies} variant={porkVariant}></lightning-button>
        <lightning-button label="Lamb" data-species="Lamb" onclick={handleSpecies} variant={lambVariant}></lightning-button>
      </div>
      <lightning-input label="Carcass ID" data-field="carcassId" value={carcassId} onchange={handleInput} maxlength="40"></lightning-input>
      <lightning-input type="file" label="Ribeye photo" accept="image/*" onchange={handleFile}></lightning-input>
      <canvas lwc:dom="manual" class="preview"></canvas>
      <template lwc:if={estimateLabel}>
        <p>{estimateLabel}</p>
      </template>
      <template lwc:if={isBeef}>
        <lightning-combobox label="Maturity" data-field="maturity" value={maturity} options={maturityOptions} onchange={handleInput}></lightning-combobox>
        <lightning-combobox label="Sex class" data-field="sexClass" value={sexClass} options={sexOptions} onchange={handleInput}></lightning-combobox>
        <lightning-combobox label="Marbling degree" data-field="marblingDegree" value={marblingDegree} options={degreeOptions} onchange={handleInput} placeholder="Confirm a degree"></lightning-combobox>
        <lightning-input type="checkbox" label="Dark cutter" data-field="darkCutter" checked={darkCutter} onchange={handleInput}></lightning-input>
        <lightning-input type="number" label="Fat thickness (in)" data-field="fatThickness" value={fatThickness} onchange={handleInput} step="0.1"></lightning-input>
        <lightning-input type="number" label="Ribeye area (sq in)" data-field="ribeyeArea" value={ribeyeArea} onchange={handleInput} step="0.1"></lightning-input>
        <lightning-input type="number" label="Hot carcass weight (lb)" data-field="hotCarcassWeight" value={hotCarcassWeight} onchange={handleInput} step="1"></lightning-input>
        <lightning-input type="number" label="Kidney, pelvic, heart fat (%)" data-field="kphPercent" value={kphPercent} onchange={handleInput} step="0.1"></lightning-input>
      </template>
      <template lwc:if={isPork}>
        <lightning-input type="number" label="Color score (1–6)" data-field="colorScore" value={colorScore} onchange={handleInput} step="1"></lightning-input>
        <lightning-input type="number" label="Marbling score (1–10)" data-field="porkMarblingScore" value={porkMarblingScore} onchange={handleInput} step="1"></lightning-input>
      </template>
      <template lwc:if={isLamb}>
        <lightning-combobox label="Flank streaking" data-field="flankStreaking" value={flankStreaking} options={streakingOptions} onchange={handleInput} placeholder="Confirm streaking"></lightning-combobox>
      </template>
      <lightning-textarea label="Notes" data-field="notes" value={notes} onchange={handleInput}></lightning-textarea>
      <p class="grade">{gradeCall}</p>
      <template lwc:if={yieldLabel}>
        <p>{yieldLabel}</p>
      </template>
      <template lwc:if={requiresReview}>
        <p class="slds-text-color_error">{decision.reviewReason}</p>
      </template>
      <template lwc:if={error}>
        <p class="slds-text-color_error" role="alert">{error}</p>
      </template>
      <template lwc:if={savedLabel}>
        <p>{savedLabel}</p>
      </template>
      <lightning-button variant="brand" label="Save grade" onclick={handleSave} class="slds-m-top_small"></lightning-button>
    </div>
  </lightning-card>
</template>
